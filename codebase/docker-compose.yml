services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kute_demo}
      POSTGRES_DB: ${POSTGRES_DB:-kute}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rag-anything:
    build:
      context: ./rag-service
      args:
        RAG_ANYTHING_COMMIT: ${RAG_ANYTHING_COMMIT:-65b7ffdeb801309d4c87b6accf81bfe5cd9b175d}
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_PHUC: ${OPENROUTER_API_KEY_PHUC:-}
      OPENROUTER_API_KEY_KHANG: ${OPENROUTER_API_KEY_KHANG:-}
      OPENROUTER_API_KEY_TRINH: ${OPENROUTER_API_KEY_TRINH:-}
      OPENROUTER_RAG_KEY_ORDER: ${OPENROUTER_RAG_KEY_ORDER:-trinh,phuc,khang,default}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.6-27b}
      RAG_LLM_API_KEY: ${GROQ_API_KEY:-}
      RAG_LLM_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
      RAG_LLM_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-2048}
      RAG_MAX_MESSAGES: ${RAG_MAX_MESSAGES:-8}
      RAG_MAX_EPISODES: ${RAG_MAX_EPISODES:-12}
      RAG_MAX_PAINPOINTS: ${RAG_MAX_PAINPOINTS:-24}
      RAG_CHUNK_TOKEN_SIZE: ${RAG_CHUNK_TOKEN_SIZE:-3000}
      RAG_STORAGE_ROOT: /data/rag_storage
    volumes:
      - rag-anything-data:/data/rag_storage
      - ./data/processed:/data/processed:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8765:8765"
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      MEMORY_PROVIDER: ${MEMORY_PROVIDER:-local}
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_DATASET_ID: ${APIFY_DATASET_ID:-}
      APIFY_API_BASE_URL: ${APIFY_API_BASE_URL:-https://api.apify.com/v2}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_BASE_URL: ${TAVILY_API_BASE_URL:-https://api.tavily.com}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_KEY_PHUC: ${OPENROUTER_API_KEY_PHUC:-}
      OPENROUTER_API_KEY_KHANG: ${OPENROUTER_API_KEY_KHANG:-}
      OPENROUTER_API_KEY_TRINH: ${OPENROUTER_API_KEY_TRINH:-}
      OPENROUTER_CHAT_KEY_ORDER: ${OPENROUTER_CHAT_KEY_ORDER:-khang,trinh,phuc,default}
      OPENROUTER_BRIEF_KEY_ORDER: ${OPENROUTER_BRIEF_KEY_ORDER:-phuc,khang,trinh,default}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.6-27b}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_USER_MAP_PATH: /app/config/telegram-users.json
      TELEGRAM_PUBLIC_USER_ID: ${TELEGRAM_PUBLIC_USER_ID:-}
      GOOGLE_CALENDAR_AUTH_MODE: ${GOOGLE_CALENDAR_AUTH_MODE:-service-account}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CALENDAR_CREDENTIALS_FILE: ${GOOGLE_CALENDAR_CREDENTIALS_FILE:-/app/config/google-service-account.json}
      GOOGLE_CALENDAR_DELEGATED_USER: ${GOOGLE_CALENDAR_DELEGATED_USER:-}
      GOOGLE_CALENDAR_OAUTH_CLIENT_FILE: ${GOOGLE_CALENDAR_OAUTH_CLIENT_FILE:-/app/config/google-calendar-oauth-client.json}
      GOOGLE_CALENDAR_OAUTH_TOKEN_FILE: ${GOOGLE_CALENDAR_OAUTH_TOKEN_FILE:-/app/state/google-calendar-oauth-token.json}
      GOOGLE_CALENDAR_OAUTH_TOKEN_JSON: ${GOOGLE_CALENDAR_OAUTH_TOKEN_JSON:-}
      GOOGLE_CALENDAR_ORGANIZER_EMAIL: ${GOOGLE_CALENDAR_ORGANIZER_EMAIL:-}
      GOOGLE_CALENDAR_OAUTH_PORT: ${GOOGLE_CALENDAR_OAUTH_PORT:-8765}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-Asia/Ho_Chi_Minh}
      GOOGLE_CALENDAR_DEFAULT_DURATION_MINUTES: ${GOOGLE_CALENDAR_DEFAULT_DURATION_MINUTES:-60}
      GOOGLE_TASKS_MODE: ${GOOGLE_TASKS_MODE:-mock}
      GOOGLE_TASKS_TASKLIST_ID: ${GOOGLE_TASKS_TASKLIST_ID:-@default}
      GOOGLE_TASKS_ACCESS_TOKEN: ${GOOGLE_TASKS_ACCESS_TOKEN:-}
      GOOGLE_TASKS_CREDENTIALS_FILE: ${GOOGLE_TASKS_CREDENTIALS_FILE:-/app/config/google-tasks-oauth.json}
      GOOGLE_TASKS_TIMEZONE: ${GOOGLE_TASKS_TIMEZONE:-Asia/Ho_Chi_Minh}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kute}:${POSTGRES_PASSWORD:-kute_demo}@postgres:5432/${POSTGRES_DB:-kute}
      RAG_ENABLED: "true"
      RAG_ANYTHING_URL: http://rag-anything:8010
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EVAL_DIR: /app/eval
      STATE_PATH: /app/state/demo_state.json
    volumes:
      - demo-state:/app/state
      - ../eval:/app/eval
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      rag-anything:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 8s
      retries: 8

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_TELEGRAM_BOT_URL: ${NEXT_PUBLIC_TELEGRAM_BOT_URL:-https://t.me/ZicZordAI20K4Bot}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  dataset-loader:
    profiles: ["index"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kute}:${POSTGRES_PASSWORD:-kute_demo}@postgres:5432/${POSTGRES_DB:-kute}
    volumes:
      - ./data/processed:/data/processed:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - app.dataset_ingest
      - --processed-dir
      - /data/processed

  rag-indexer:
    profiles: ["index"]
    build:
      context: ./backend
    depends_on:
      rag-anything:
        condition: service_healthy
    command:
      - python
      - -m
      - app.rag_index
      - --url
      - http://rag-anything:8010
      - --scope-key
      - cohort:K4
      - --processed-dir
      - /data/processed

  learning-loader:
    profiles: ["index"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kute}:${POSTGRES_PASSWORD:-kute_demo}@postgres:5432/${POSTGRES_DB:-kute}
    volumes:
      - ../data/vlearn-pack:/data/vlearn-pack:ro
      - ../:/repo:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - app.learning_ingest
      - --pack-root
      - /data/vlearn-pack
      - --competition-root
      - /repo

  hindsight:
    profiles: ["hindsight"]
    image: ghcr.io/vectorize-io/hindsight:0.8.6
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:-gemini}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  demo-state:
  hindsight-data:
  postgres-data:
  rag-anything-data:
